name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Format check, compile, unit + Testcontainers integration tests, coverage
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore

  # The Helm chart on a real (kind) cluster: install everything, then `helm test` places an order
  # through the gateway and waits for the saga to confirm it
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: azure/setup-helm@v4

      - name: Chart files match the Docker Compose files
        run: |
          diff docker/keycloak/orderflow-realm.json deploy/helm/orderflow/files/keycloak/orderflow-realm.json
          diff docker/postgres/init/01-create-databases.sql deploy/helm/orderflow/files/postgres/01-create-databases.sql
          diff -r docker/grafana/dashboards deploy/helm/orderflow/files/grafana/dashboards
          diff -r docker/grafana/provisioning deploy/helm/orderflow/files/grafana/provisioning

      - name: Lint the chart
        run: helm lint --strict deploy/helm/orderflow

      - uses: helm/kind-action@v1
        with:
          config: deploy/kind/cluster.yaml
          cluster_name: orderflow

      - name: Install on kind and run helm test
        run: |
          chmod +x mvnw deploy/kind.sh
          TAG=ci deploy/kind.sh

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n orderflow get pods -o wide
          kubectl -n orderflow get events --sort-by=.lastTimestamp | tail -40
          for d in gateway order-service inventory-service payment-service notification-service; do
            echo "=== $d"; kubectl -n orderflow logs deploy/$d --tail=60 || true
          done
