server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/payments}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

orderflow:
  payment:
    # The fake provider declines any charge above this amount
    decline-above: "1000.00"
