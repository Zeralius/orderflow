{{- define "orderflow.prometheusConfig" -}}
global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: orderflow
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      # Only pods that ask to be scraped, and only their "http" port
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      # job = the app's name, as in Docker Compose, so the Grafana dashboard works unchanged
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
{{- end }}

{{- if and .Values.devInfrastructure.enabled .Values.prometheus.enabled }}
{{- $ctx := dict "root" $ "name" "prometheus" "component" "observability" }}
# Prometheus asks the Kubernetes API for the pods to scrape, so every replica is scraped and new
# services need no config change: a pod only has to carry the annotation prometheus.io/scrape.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
rules:
  # Read-only, and only in this namespace
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
data:
  prometheus.yml: |
    {{- include "orderflow.prometheusConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "orderflow.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orderflow.labels" $ctx | nindent 8 }}
        orderflow.io/role: prometheus
      annotations:
        checksum/config: {{ include "orderflow.prometheusConfig" . | sha256sum }}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
{{ include "orderflow.service" (dict "root" $ "name" "prometheus" "component" "observability" "ports" (list (dict "name" "http" "port" 9090 "nodePort" .Values.prometheus.nodePort))) }}
{{- end }}
