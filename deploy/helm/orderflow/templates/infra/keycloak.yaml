{{- if .Values.devInfrastructure.enabled }}
{{- $ctx := dict "root" $ "name" "keycloak" "component" "identity" }}
# Keycloak in dev mode with the OrderFlow realm imported at start (same realm file as Docker Compose)
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
data:
  orderflow-realm.json: |-
    {{- .Files.Get "files/keycloak/orderflow-realm.json" | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.keycloak.adminUsername | quote }}
  password: {{ .Values.keycloak.adminPassword | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "orderflow.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orderflow.labels" $ctx | nindent 8 }}
      annotations:
        checksum/realm: {{ .Files.Get "files/keycloak/orderflow-realm.json" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: [start-dev, --import-realm]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: {name: keycloak-admin, key: username}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-admin, key: password}
            # Tokens always carry this issuer, whether fetched from outside or inside the cluster
            - {name: KC_HOSTNAME, value: {{ .Values.keycloak.publicUrl | quote }}}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
{{ include "orderflow.service" (dict "root" $ "name" "keycloak" "component" "identity" "ports" (list (dict "name" "http" "port" 8080 "nodePort" .Values.keycloak.nodePort))) }}
{{- end }}
