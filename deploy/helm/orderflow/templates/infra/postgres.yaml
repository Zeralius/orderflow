{{- if .Values.devInfrastructure.enabled }}
{{- $ctx := dict "root" $ "name" "postgres" "component" "database" }}
# One PostgreSQL with one database per service (created by the init script on first start)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
data:
  01-create-databases.sql: |-
    {{- .Files.Get "files/postgres/01-create-databases.sql" | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "orderflow.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orderflow.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: {{ include "orderflow.databaseSecret" $ }}, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "orderflow.databaseSecret" $ }}, key: password}
            - name: POSTGRES_DB
              value: orderflow
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER"']
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
{{ include "orderflow.service" (dict "root" $ "name" "postgres" "component" "database" "headless" true "ports" (list (dict "name" "postgres" "port" 5432))) }}
{{- end }}
