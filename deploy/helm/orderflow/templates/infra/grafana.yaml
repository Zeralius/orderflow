{{- if and .Values.devInfrastructure.enabled .Values.grafana.enabled }}
{{- $ctx := dict "root" $ "name" "grafana" "component" "observability" }}
# Grafana with the same provisioning and dashboard as Docker Compose (Prometheus and Jaeger have
# the same names here, so the files are identical)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
data:
  datasources.yml: |-
    {{- .Files.Get "files/grafana/provisioning/datasources/datasources.yml" | nindent 4 }}
  dashboards.yml: |-
    {{- .Files.Get "files/grafana/provisioning/dashboards/dashboards.yml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
data:
  orderflow.json: |-
    {{- .Files.Get "files/grafana/dashboards/orderflow.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "orderflow.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orderflow.labels" $ctx | nindent 8 }}
      annotations:
        checksum/dashboards: {{ .Files.Get "files/grafana/dashboards/orderflow.json" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          ports:
            - name: http
              containerPort: 3000
          env:
            # Demo: open without login, read-only for visitors
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/orderflow.json}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: datasources
          configMap:
            name: grafana-provisioning
            items: [{key: datasources.yml, path: datasources.yml}]
        - name: dashboard-provider
          configMap:
            name: grafana-provisioning
            items: [{key: dashboards.yml, path: dashboards.yml}]
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
{{ include "orderflow.service" (dict "root" $ "name" "grafana" "component" "observability" "ports" (list (dict "name" "http" "port" 3000 "nodePort" .Values.grafana.nodePort))) }}
{{- end }}
