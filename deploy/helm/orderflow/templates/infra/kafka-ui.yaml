{{- if and .Values.devInfrastructure.enabled .Values.kafkaUi.enabled }}
{{- $ctx := dict "root" $ "name" "kafka-ui" "component" "messaging" }}
# Browse topics and messages (incl. the .dlt topics) on the NodePort
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  labels:
    {{- include "orderflow.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "orderflow.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orderflow.labels" $ctx | nindent 8 }}
        orderflow.io/kafka-client: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kafka-ui
          image: {{ .Values.kafkaUi.image }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: KAFKA_CLUSTERS_0_NAME, value: orderflow}
            - {name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: {{ .Values.kafka.bootstrapServers | quote }}}
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.kafkaUi.resources | nindent 12 }}
---
{{ include "orderflow.service" (dict "root" $ "name" "kafka-ui" "component" "messaging" "ports" (list (dict "name" "http" "port" 8080 "nodePort" .Values.kafkaUi.nodePort))) }}
{{- end }}
