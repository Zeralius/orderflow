server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/inventory}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must come from this Keycloak realm and be meant for the OrderFlow API.
          # Keys are fetched from jwk-set-uri (inside Docker: http://keycloak:8080/...).
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/orderflow}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/orderflow/protocol/openid-connect/certs}
          audiences: orderflow-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
