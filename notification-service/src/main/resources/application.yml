server:
  port: 8084

spring:
  config:
    # Metrics, tracing and their settings, shared by all services
    import: classpath:orderflow-observability.yml
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notifications}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
  mail:
    # Mailpit locally (web UI on http://localhost:8025); a real SMTP server in production
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

orderflow:
  notification:
    from: "OrderFlow <orders@orderflow.local>"

